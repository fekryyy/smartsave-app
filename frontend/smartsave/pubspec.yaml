name: smartsave
description: SmartSave - Personal Finance & Savings Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Network
  dio: ^5.4.0
  retrofit: ^4.0.1
  connectivity_plus: ^5.0.2

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  fl_chart: ^0.65.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  animate_do: ^3.1.2
  lottie: ^2.7.0
  intl: ^0.19.0
  percent_indicator: ^4.2.3
  cached_network_image: ^3.3.0

  # Auth
  # Temporarily removed google_sign_in: ^6.1.5 due to CocoaPods conflict with Firebase

  # Image/OCR
  image_picker: ^1.0.7

  # Voice
  speech_to_text: ^6.6.0

  # Charts
  syncfusion_flutter_charts: ^24.1.41

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1

  # CSV
  csv: ^6.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0
  firebase_messaging: ^14.7.10
  firebase_core: ^2.24.2

  # Utils
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1
  permission_handler: ^11.1.0
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  google_sign_in: ^6.2.2
  firebase_auth: ^4.17.8
  get_it: ^7.7.0
  google_sign_in_ios: ^5.7.0
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  retrofit_generator: ^8.0.6
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/
